name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package checked-out source
        shell: pwsh
        run: ./scripts/package.ps1 -InstallCompiler
      - name: Upload component packages and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: DSNForge-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DSNForge-${{ github.sha }}
          path: dist
      - name: Publish release built from the tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem dist -File).FullName
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "DSNForge $version" --notes-file "docs/releases/$version.md"
